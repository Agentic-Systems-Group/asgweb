name: Validate company site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agentic-systems-group-site/package-lock.json

      - name: Install deps
        working-directory: agentic-systems-group-site
        run: npm ci

      - name: Build Astro
        working-directory: agentic-systems-group-site
        run: npm run build

      - name: Audit dependencies
        working-directory: agentic-systems-group-site
        run: npm audit --audit-level=high

